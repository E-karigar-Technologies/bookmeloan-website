<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Book Me Loan - Contact Us</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind = {
        config: {
          theme: {
            extend: {
              fontFamily: {
                sans: ["Inter", "ui-sans-serif", "system-ui"],
              },
              colors: {
                brand: {
                  DEFAULT: "#14b8a6",
                  dark: "#0f766e",
                  soft: "#ecfdf5",
                },
              },
              boxShadow: {
                soft: "0 18px 40px rgba(16, 185, 129, 0.12)",
              },
            },
          },
        },
      };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .grid-dots {
        background-image: radial-gradient(
          rgba(20, 184, 166, 0.12) 1px,
          transparent 1px
        );
        background-size: 20px 20px;
      }
    </style>
  </head>
  <body class="font-sans text-slate-900 bg-white">
    <div class="relative overflow-hidden">
      <div
        class="pointer-events-none absolute -top-24 -left-20 h-64 w-64 rounded-full bg-emerald-100/70 blur-3xl"
      ></div>
      <div
        class="pointer-events-none absolute top-32 right-[-120px] h-96 w-96 rounded-full bg-emerald-100/70 blur-3xl"
      ></div>

      <site-navbar active="contact"></site-navbar>

      <main>
        <section class="relative pb-20 section-grid pt-24 md:pt-32">
          <div class="absolute inset-0 grid-dots opacity-70"></div>
          <div class="relative mx-auto max-w-6xl px-6 text-center">
            <h1
              class="text-3xl font-extrabold text-slate-900 sm:text-4xl md:text-5xl"
            >
              Get in <span class="text-brand">Touch</span>
            </h1>
            <p
              class="mx-auto mt-4 max-w-2xl text-sm text-slate-600 sm:text-base"
            >
              Have questions or ideas? We’re here to help you connect,
              collaborate and grow with Book Me Loan.
            </p>

            <div class="mt-12 grid gap-8 text-left lg:grid-cols-[1fr_1.4fr]">
              <div
                class="relative overflow-hidden rounded-3xl bg-gradient-to-br from-emerald-400 to-emerald-500 p-8 text-white shadow-soft"
              >
                <div
                  class="pointer-events-none absolute -bottom-8 -right-10 h-36 w-36 rounded-full bg-emerald-300/50"
                ></div>
                <div
                  class="pointer-events-none absolute bottom-8 right-12 h-24 w-24 rounded-full bg-emerald-200/40"
                ></div>

                <h2 class="text-lg font-semibold">Contact Details</h2>
                <div class="mt-3 h-0.5 w-16 rounded-full bg-white/70"></div>

                <div class="mt-8 space-y-6 text-sm">
                  <div class="flex items-start gap-4">
                    <span
                      class="flex h-10 w-10 items-center justify-center rounded-full bg-white/20"
                    >
                      <svg
                        class="h-5 w-5"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                      >
                        <path
                          d="M22 16.9v3a2 2 0 0 1-2.18 2A19.8 19.8 0 0 1 3.1 5.18 2 2 0 0 1 5 3h3a2 2 0 0 1 2 1.72c.12.9.31 1.77.57 2.62a2 2 0 0 1-.45 2.11L9 10a16 16 0 0 0 5 5l.55-.12a2 2 0 0 1 2.11-.45c.85.26 1.72.45 2.62.57A2 2 0 0 1 22 16.9z"
                        ></path>
                      </svg>
                    </span>
                    <div>
                      <p
                        class="text-xs uppercase tracking-wide text-emerald-50/80"
                      >
                        Contact no :
                      </p>
                      <p class="mt-1 text-base font-semibold">8133987654</p>
                    </div>
                  </div>

                  <div class="h-px w-full bg-white/30"></div>

                  <div class="flex items-start gap-4">
                    <span
                      class="flex h-10 w-10 items-center justify-center rounded-full bg-white/20"
                    >
                      <svg
                        class="h-5 w-5"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                      >
                        <path d="M4 4h16v16H4z"></path>
                        <path d="m4 6 8 6 8-6"></path>
                      </svg>
                    </span>
                    <div>
                      <p
                        class="text-xs uppercase tracking-wide text-emerald-50/80"
                      >
                        Email Id :
                      </p>
                      <p class="mt-1 text-base font-semibold">
                        team@collabskool.com
                      </p>
                    </div>
                  </div>
                </div>
              </div>

              <form class="grid gap-5">
                <input
                  type="text"
                  placeholder="Your Name"
                  class="w-full rounded-full border border-emerald-100 bg-emerald-100/70 px-5 py-3 text-sm text-slate-700 placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-300"
                />
                <input
                  type="email"
                  placeholder="Your Email"
                  class="w-full rounded-full border border-emerald-100 bg-emerald-100/70 px-5 py-3 text-sm text-slate-700 placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-300"
                />
                <input
                  type="text"
                  placeholder="Contact no"
                  class="w-full rounded-full border border-emerald-100 bg-emerald-100/70 px-5 py-3 text-sm text-slate-700 placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-300"
                />
                <textarea
                  rows="4"
                  placeholder="Your Message"
                  class="w-full rounded-3xl border border-emerald-100 bg-emerald-100/70 px-5 py-3 text-sm text-slate-700 placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-300"
                ></textarea>

                <!-- New Button -->
                <!-- New Button -->
                <button
                  type="button"
                  class="w-full mt-2 rounded-full bg-emerald-500 px-5 py-3 text-sm font-semibold text-black shadow-soft transition hover:bg-emerald-400"
                >
                  Submit
                </button>
              </form>
            </div>
          </div>
        </section>
      </main>

      <site-footer></site-footer>
    </div>

    <script src="./components.js"></script>
  </body>
</html>
