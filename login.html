<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Auth - Book Me Loan</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>

<body class="bg-emerald-50 min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-5xl bg-white rounded-3xl shadow-xl overflow-hidden grid md:grid-cols-2">

  <!-- LEFT -->
  <div class="hidden md:flex items-center justify-center bg-emerald-500 p-10">
    <div class="text-center text-white">
      <div class="bg-white p-3 rounded-2xl mb-6">
        <img src="./image.png" class="h-12 w-auto mx-auto" />
      </div>
      <h2 class="text-2xl font-bold">Book Me Loan</h2>
      <p class="text-sm mt-2 opacity-90">Login or create account</p>
    </div>
  </div>

  <!-- RIGHT -->
  <div class="p-8">

    <!-- MOBILE LOGO -->
    <div class="flex justify-center mb-3 md:hidden">
      <img src="./image.png" class="h-10" />
    </div>

    <!-- TABS -->
    <div class="flex justify-center gap-3 mb-6">
      <button id="loginTab" onclick="showLogin()"
        class="px-4 py-2 text-sm rounded-full bg-emerald-500 text-white">
        Login
      </button>

      <button id="signupTab" onclick="showSignup()"
        class="px-4 py-2 text-sm rounded-full border border-emerald-200 text-emerald-700">
        Signup
      </button>
    </div>

    <!-- LOGIN -->
    <div id="loginBox">

      <h2 class="text-xl font-bold text-center text-emerald-700">Login</h2>

      <!-- EMAIL OR MOBILE -->
      <div id="loginEmailStep" class="mt-6 space-y-3">

        <div class="relative">
          <i class="fa-solid fa-user absolute left-3 top-3.5 text-gray-400"></i>

          <input id="loginIdentifier" type="text"
            placeholder="Enter Email or Mobile"
            class="w-full border rounded-xl pl-10 px-4 py-3 text-sm"/>
        </div>

        <button onclick="sendLoginOtp()"
          class="w-full bg-emerald-500 text-white py-3 rounded-xl font-semibold">
          Send OTP
        </button>
      </div>

      <!-- OTP -->
      <div id="loginOtpStep" class="mt-6 hidden space-y-3">

        <div class="relative">
          <i class="fa-solid fa-key absolute left-3 top-3.5 text-gray-400"></i>

          <input id="loginOtp" type="text"
            placeholder="Enter OTP"
            class="w-full border rounded-xl pl-10 px-4 py-3 text-sm"/>
        </div>

        <button onclick="verifyLoginOtp()"
          class="w-full bg-emerald-500 text-white py-3 rounded-xl font-semibold">
          Login
        </button>

        <button onclick="backLoginEmail()" class="w-full text-sm text-gray-500">
          ← Back
        </button>
      </div>

    </div>

    <!-- SIGNUP -->
    <div id="signupBox" class="hidden">

      <h2 class="text-xl font-bold text-center text-emerald-700">Create Account</h2>

      <!-- STEP 1 -->
      <div id="signupStep1" class="mt-6 space-y-3">

        <input id="signupName" type="text" placeholder="Full Name"
          class="w-full border rounded-xl px-4 py-3 text-sm"/>

        <input id="signupEmail" type="email" placeholder="Email"
          class="w-full border rounded-xl px-4 py-3 text-sm"/>

        <input id="signupMobile" type="tel" placeholder="Mobile Number"
          class="w-full border rounded-xl px-4 py-3 text-sm"/>

        <button onclick="sendSignupOtp()"
          class="w-full bg-emerald-500 text-white py-3 rounded-xl font-semibold">
          Send OTP
        </button>

      </div>

      <!-- STEP 2 -->
      <div id="signupStep2" class="mt-6 hidden space-y-3">

        <input id="signupOtp" type="text"
          placeholder="Enter OTP"
          class="w-full border rounded-xl px-4 py-3 text-sm"/>

        <button onclick="verifySignupOtp()"
          class="w-full bg-emerald-500 text-white py-3 rounded-xl font-semibold">
          Create Account
        </button>

        <button onclick="backSignup()" class="w-full text-sm text-gray-500">
          ← Back
        </button>
      </div>

    </div>

  </div>
</div>

<script>
const BASE_URL = "http://localhost:5010";

function getLoginPayload(identifier) {
  const value = identifier.trim();
  const isPhoneNumber = /^\+?\d{7,15}$/.test(value);

  return isPhoneNumber ? { mobile: value } : { email: value };
}

function storeAuthSession(data) {
  const payload = data?.data || data || {};
  const token = payload.token || data?.token;
  const user = payload.user || data?.user;

  if (token) {
    localStorage.setItem("token", token);
    localStorage.setItem("isLoggedIn", "true");
  }

  if (user) {
    localStorage.setItem("user", JSON.stringify(user));
  }

  return token;
}

const el = {
  loginOtp: document.getElementById("loginOtp"),
  loginOtpStep: document.getElementById("loginOtpStep"),
  loginEmailStep: document.getElementById("loginEmailStep"),

  signupName: document.getElementById("signupName"),
  signupEmail: document.getElementById("signupEmail"),
  signupMobile: document.getElementById("signupMobile"),
  signupOtp: document.getElementById("signupOtp"),
  signupStep1: document.getElementById("signupStep1"),
  signupStep2: document.getElementById("signupStep2"),

  loginBox: document.getElementById("loginBox"),
  signupBox: document.getElementById("signupBox"),
};

const show = (e) => e.classList.remove("hidden");
const hide = (e) => e.classList.add("hidden");

/* ================= TABS ================= */
function showLogin() {
  show(el.loginBox);
  hide(el.signupBox);

  document.getElementById("loginTab").classList.add(
    "bg-emerald-500",
    "text-white"
  );

  document.getElementById("loginTab").classList.remove(
    "border",
    "border-emerald-200",
    "text-emerald-700"
  );

  document.getElementById("signupTab").classList.remove(
    "bg-emerald-500",
    "text-white"
  );

  document.getElementById("signupTab").classList.add(
    "border",
    "border-emerald-200",
    "text-emerald-700"
  );
}

function showSignup() {
  show(el.signupBox);
  hide(el.loginBox);

  document.getElementById("signupTab").classList.add(
    "bg-emerald-500",
    "text-white"
  );

  document.getElementById("signupTab").classList.remove(
    "border",
    "border-emerald-200",
    "text-emerald-700"
  );

  document.getElementById("loginTab").classList.remove(
    "bg-emerald-500",
    "text-white"
  );

  document.getElementById("loginTab").classList.add(
    "border",
    "border-emerald-200",
    "text-emerald-700"
  );
}

/* ================= LOGIN SEND OTP ================= */
async function sendLoginOtp() {

  const identifier = document
    .getElementById("loginIdentifier")
    .value
    .trim();

  if (!identifier) {
    return alert("Enter Email or Mobile");
  }

  try {

    const res = await fetch(`${BASE_URL}/api/user/send-otp`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        ...getLoginPayload(identifier)
      })
    });

    const data = await res.json();

    console.log("SEND OTP RESPONSE :", data);

    if (!data.success) {
      return alert(data.message || "Failed to send OTP");
    }

    hide(el.loginEmailStep);
    show(el.loginOtpStep);

    alert("OTP Sent Successfully");

  } catch (error) {
    console.log(error);
    alert("Server Error");
  }
}

/* ================= LOGIN VERIFY OTP ================= */
async function verifyLoginOtp() {

  const identifier = document
    .getElementById("loginIdentifier")
    .value
    .trim();

  const otp = el.loginOtp.value.trim();

  if (!otp) {
    return alert("Enter OTP");
  }

  try {

    const res = await fetch(`${BASE_URL}/verify-otp`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        ...getLoginPayload(identifier),
        otp: otp
      })
    });

    const data = await res.json();

    console.log("VERIFY OTP RESPONSE :", data);

    if (!data.success) {
      return alert(data.message || "Invalid OTP");
    }

    const token = storeAuthSession(data);

    if (!token) {
      return alert("Login succeeded, but no token was returned by the server.");
    }

    alert("Login Successful");

    window.location.href = "index.html#loan-apply";

  } catch (error) {
    console.log(error);
    alert("Server Error");
  }
}

/* ================= SIGNUP SEND OTP ================= */
async function sendSignupOtp() {

  const name = el.signupName.value.trim();
  const email = el.signupEmail.value.trim();
  const mobile = el.signupMobile.value.trim();

  if (!name || !email || !mobile) {
    return alert("Fill all fields");
  }

  try {

    const res = await fetch(`${BASE_URL}/api/user/send-otp`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        email: email
      })
    });

    const data = await res.json();

    console.log("SIGNUP OTP RESPONSE :", data);

    if (!data.success) {
      return alert(data.message || "Failed to send OTP");
    }

    hide(el.signupStep1);
    show(el.signupStep2);

    alert("OTP Sent Successfully");

  } catch (error) {
    console.log(error);
    alert("Server Error");
  }
}

/* ================= SIGNUP VERIFY ================= */
async function verifySignupOtp() {

  const name = el.signupName.value.trim();
  const email = el.signupEmail.value.trim();
  const mobile = el.signupMobile.value.trim();
  const otp = el.signupOtp.value.trim();

  if (!otp) {
    return alert("Enter OTP");
  }

  try {

    /* VERIFY OTP */
    const verifyRes = await fetch(`${BASE_URL}/api/user/verify-otp`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        email: email,
        otp: otp
      })
    });

    const verifyData = await verifyRes.json();

    console.log("VERIFY SIGNUP OTP :", verifyData);

    if (!verifyData.success) {
      return alert(verifyData.message || "Invalid OTP");
    }

    /* CREATE USER */
    const createRes = await fetch(`${BASE_URL}/api/user/create`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        name,
        email,
        mobile
      })
    });

    const createData = await createRes.json();

    console.log("CREATE USER :", createData);

    if (!createData.success) {
      return alert(createData.message || "User creation failed");
    }

    localStorage.setItem("isLoggedIn", "true");

    if (createData.token) {
      localStorage.setItem("token", createData.token);
    }

    if (createData.user) {
      localStorage.setItem("user", JSON.stringify(createData.user));
    }

    alert("Account Created Successfully");

    window.location.href = "index.html#loan-apply";

  } catch (error) {
    console.log(error);
    alert("Server Error");
  }
}

/* ================= BACK ================= */
function backLoginEmail() {
  hide(el.loginOtpStep);
  show(el.loginEmailStep);
}

function backSignup() {
  hide(el.signupStep2);
  show(el.signupStep1);
}

/* ================= DEFAULT ================= */
showLogin();

</script>

</body>
</html>
